name: Publish Docker Images

# DISABLED - Set `if: false` to prevent execution
# To enable: Remove the `if: false` line from the job below

on:
  # Trigger on tag push
  push:
    tags:
      - 'js-client@*'
      - 'fastapi-fullstack@*'
  
  # Allow manual trigger
  workflow_dispatch:
    inputs:
      app:
        description: 'App to publish (js-client or fastapi-fullstack)'
        required: true
        type: choice
        options:
          - js-client
          - fastapi-fullstack
      version:
        description: 'Version to tag (e.g., 1.2.3)'
        required: true
        type: string

# Permissions for GHCR
permissions:
  contents: read
  packages: write

jobs:
  publish-docker:
    name: Publish Docker Image
    runs-on: ubuntu-latest
    # DISABLED - Remove this line to enable Docker publishing
    if: false
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Determine app and version
        id: vars
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            APP="${{ github.event.inputs.app }}"
            VERSION="${{ github.event.inputs.version }}"
          else
            TAG_NAME=${GITHUB_REF#refs/tags/}
            APP=${TAG_NAME%@*}
            VERSION=${TAG_NAME#*@}
          fi
          
          echo "app=$APP" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "image=ghcr.io/${{ github.repository_owner }}/$APP" >> $GITHUB_OUTPUT
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.vars.outputs.image }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.vars.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.vars.outputs.version }}
            type=semver,pattern={{major}},value=${{ steps.vars.outputs.version }}
            type=raw,value=latest,enable={{is_default_branch}}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/${{ steps.vars.outputs.app }}
          file: ./apps/${{ steps.vars.outputs.app }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
      
      - name: Summary
        run: |
          echo "### ✅ Docker Image Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**App:** ${{ steps.vars.outputs.app }}" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.vars.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** ${{ steps.vars.outputs.image }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:**" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
